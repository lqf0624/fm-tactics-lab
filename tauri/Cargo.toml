[package]
name = "fm27-tactics-lab"
version = "1.114.6"
edition = "2021"

[build-dependencies]
tauri-build = "=2.5.6"

[dependencies]
base64 = "0.22"
flate2 = "1"
rfd = { version = "0.16", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.10.3", features = ["custom-protocol"] }
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }

[profile.release]
strip = true
