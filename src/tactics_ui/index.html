<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>FM27 战术实验室</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/desktop.css"></head>
<body>
<aside class="rail"><a class="brand" href="/">FM<span>27</span><small>战术实验室</small></a><nav><button data-view="tactics" class="active">◈ <span>战术板</span></button><button data-view="players">♙ <span>球员属性</span></button><button data-view="library">▥ <span>存档战术</span></button><button data-view="results">▤ <span>实验结果</span></button><button data-view="guide">⌘ <span>使用说明</span></button></nav><div class="rail-bottom"><i class="status-dot"></i>原版原生引擎<small>本机独立运行</small></div></aside>
<div class="shell"><header><div><div class="eyebrow">FOOTBALL SIMULATION WORKSPACE</div><h1 id="page-title">把想法放到球场上</h1></div><div class="header-actions"><span class="tag" id="desktop-version">v1114.6 · 中文阵容版</span><span id="save-status">自动保存在本机浏览器</span><button id="import" class="button">打开完整方案 JSON</button><button id="export" class="button">保存完整方案 JSON</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><input id="match-file" type="file" accept=".fmf" hidden></header>
<section id="engine-settings" class="card" style="margin:12px 24px;padding:12px"><details id="engine-details"><summary id="engine-summary">正在检查本地引擎…</summary><p id="engine-message"></p><label>FM27 游戏安装目录 <input id="engine-path" type="text" style="width:65%" placeholder="包含 fm_Data 和 shared 的游戏目录"></label> <button id="engine-check" class="button">选择此目录并检查</button><pre id="engine-diagnostics" style="white-space:pre-wrap;max-height:180px;overflow:auto"></pre></details></section><section id="action-error" class="results-error action-error" role="alert" hidden><div><strong id="action-error-title"></strong><p id="action-error-detail"></p></div><button id="dismiss-action-error" type="button" class="button small">关闭</button></section><main id="workspace"><div class="loading">正在加载原生比赛输入…</div></main>
<footer class="runbar"><div class="run-description"><span class="status-dot"></span><strong id="run-label">就绪</strong><small id="run-detail">配置开赛前将经过原生回读校验</small></div><div class="run-inputs"><label>起始种子<input id="seed" type="number" min="0" max="4294967295" value="42"></label><label>每方案场数<input id="count" type="number" min="1" max="10000" value="2"></label><label>并行数<input id="workers" type="number" min="1" max="256" step="1" value="4" aria-label="并行数"></label><label class="compare-toggle"><input id="compare" type="checkbox">与已保存战术对比</label><button id="cancel" class="button" hidden>取消</button><button id="run" class="button primary">运行比赛 <span>↗</span></button></div><div id="run-progress"></div></footer>
</div><div id="toast" role="status"></div><dialog id="confirm-reset"><h2>恢复样本输入？</h2><p>这会替换当前编辑内容，已保存的对照方案仍会保留。</p><div class="dialog-actions"><button class="button" id="reset-no">保留编辑</button><button class="button primary" id="reset-yes">恢复</button></div></dialog>
<link rel="stylesheet" href="/save-mode.css"><script src="/i18n-en.js"></script><script src="/i18n.js"></script><script src="/app.js"></script><script src="/advanced.js"></script><script src="/setpieces.js"></script><script src="/batch.js"></script><script src="/player-display.js"></script><script src="/desktop.js"></script><script src="/match-events.js"></script><script src="/desktop-workspace.js"></script><script src="/team-bulk.js"></script><script src="/engine-settings.js"></script><script src="/league-testing.js"></script><script src="/save-mode.js"></script><script src="/tactic-pool.js"></script><script src="/tactic-library.js"></script><script src="/squad-editor.js"></script></body></html>
